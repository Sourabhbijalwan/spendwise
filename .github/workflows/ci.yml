name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # postinstall already does this; explicit so it still works if install scripts are disabled.
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Every page reads the database at request time, so the build needs no DATABASE_URL.
      - run: npm run build
